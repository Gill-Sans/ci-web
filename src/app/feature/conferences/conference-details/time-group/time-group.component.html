<div class="time-group">
    <div class="time-header">
        <mat-icon>access_time</mat-icon>
        <h3>{{ time }}</h3>
    </div>
    <div class="sessions-grid">
        <app-session-card
            *ngFor="let session of sessions"
            [session]="session"
            [checkins]="sessionCheckins[session.sessionId] || []"
            [isCheckedIn]="isCheckedInSession(session.sessionId)"
            [isTimeConflict]="hasCheckedInInGroup && !isCheckedInSession(session.sessionId)"
            [variant]="getVariant(session)"
            (checkIn)="checkIn.emit(session)">
        </app-session-card>
    </div>
</div>
