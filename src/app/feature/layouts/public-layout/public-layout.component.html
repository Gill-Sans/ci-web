<mat-toolbar>
    <span>My App</span>
    <span class="toolbar__spacer"></span>
    <div class="toolbar__user" *ngIf="tokenParsed; else noToken">
        <button mat-flat-button aria-label="Open platform" (click)="toPlatform()">Open platform</button>
        <button mat-stroked-button aria-label="Logout" (click)="logout()">logout</button>
    </div>
    <ng-template #noToken>
        <div class="toolbar__user">
            <button mat-stroked-button aria-label="Login" (click)="login()">login</button>
            <button mat-flat-button aria-label="Register" (click)="register()">register</button>
        </div>
    </ng-template>
</mat-toolbar>
<div class="app__container">
    <ng-container>
        <section class="public-hero">
            <h1>Welcome to Capit</h1>
            <p>Your go-to conference companion: plan sessions, check in & out, and track live attendance in real time.</p>
        </section>
        <section class="features-grid">
            <mat-card *ngFor="let feature of features" class="feature-card">
                <mat-icon>{{ feature.icon }}</mat-icon>
                <h3>{{ feature.title }}</h3>
                <p>{{ feature.description }}</p>
            </mat-card>
        </section>
    </ng-container>
</div>
