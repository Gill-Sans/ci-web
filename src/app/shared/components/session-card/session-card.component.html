<div
    class="session-card"
    [class.session-card--neutral]="variant === 'neutral'"
    [class.session-card--warn]="variant === 'warn'"
    [class.session-card--danger]="variant === 'danger'"
    [class.registration-session]="
    !session.speaker
    || session.title.toLowerCase().includes('registration')
    || session.title.toLowerCase().includes('break')
  "
    [class.special-session]="
    session.title.toLowerCase().includes('keynote')
  "
>
    <!-- header -->
    <div class="session-header">
        <h3 class="session-title">{{ session.title }}</h3>
        <div class="session-time">
            {{ session.startTime | date:'shortTime' }}
            —
            {{ session.endTime | date:'shortTime' }}
        </div>
    </div>

    <!-- content -->
    <div class="session-content">
        <div *ngIf="session.speaker" class="session-detail">
            <mat-icon>person</mat-icon>
            <span>{{ session.speaker }}</span>
        </div>

        <div class="session-detail">
            <mat-icon>room</mat-icon>
            <span>{{ session.locationDetails || 'No Room' }}</span>
        </div>

        <!-- attendee avatars -->
        <div *ngIf="checkins.length" class="checkin-avatars">
            <div class="avatars">
                <ng-container *ngFor="let c of displayedCheckins">
                    <div class="avatar" [matTooltip]="c.firstName + ' ' + c.lastName">
                        <mat-icon>person</mat-icon>
                    </div>
                </ng-container>
                <div *ngIf="overflowCount" class="avatar avatar--overflow" [matTooltip]="overflowNames">
                    +{{ overflowCount }}
                </div>
            </div>
        </div>
    </div>

    <!-- actions -->
    <div class="session-actions">
        <button
            mat-flat-button
            [color]="isCheckedIn ? 'primary' : 'accent'"
            [disabled]="isCheckedIn || isTimeConflict"
            [matTooltip]="isTimeConflict ? 'You are already checked in to another session at this time' : ''"
            (click)="checkIn.emit(session)"
        >
            <mat-icon>
                {{ isCheckedIn ? 'how_to_reg' : 'person_add' }}
            </mat-icon>
            {{ isCheckedIn ? 'Checked In' : 'Check In' }}
        </button>
    </div>
</div>
