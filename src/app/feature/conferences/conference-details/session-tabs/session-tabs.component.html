<mat-tab-group class="custom-tabs" *ngIf="dates.length > 0">
    <mat-tab
        *ngFor="let date of dates"
        [label]="(date | date:'EEE, MMM d, y') || '' ">
        <div class="sessions-container">
            <app-time-group
                *ngFor="let group of groupedSessions[date.toDateString()]"
                [time]="group.time"
                [sessions]="group.sessions"
                (checkIn)="checkIn.emit($event)">
            </app-time-group>
        </div>
    </mat-tab>
</mat-tab-group>
