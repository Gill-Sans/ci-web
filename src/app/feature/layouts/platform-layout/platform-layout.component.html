<mat-toolbar>
    <button mat-icon-button aria-label="Toggle sidenav" (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
    </button>
    <span>My App</span>
    <span class="example-spacer"></span>
    <button mat-stroked-button aria-label="Login">
        login
    </button>
    <button mat-flat-button aria-label="Register">
        register
    </button>
</mat-toolbar>

<mat-sidenav-container class="example-container">
    <mat-sidenav #sidenav mode="push" [opened]="true">
        <!-- Navigation content can go here -->
        <p>Navigation Menu</p>
        <mat-nav-list>
            <a mat-list-item routerLink="/" routerLinkActive="active" class="nav-list__item"><mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"></mat-icon><span matLine>Home</span></a>
            <a mat-list-item routerLink="/platform/sessions" routerLinkActive="active" class="nav-list__item"><mat-icon aria-hidden="false" aria-label="event icon" fontIcon="event"></mat-icon><span>Conferences</span></a>
        </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
        <!-- The routed content will be displayed here -->
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
