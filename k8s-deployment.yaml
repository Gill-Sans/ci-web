apiVersion: v1
kind: Service
metadata:
  name: ci-web
spec:
  selector:
    app: ci-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-web
  template:
    metadata:
      labels:
        app: ci-web
    spec:
      containers:
        - name: ci-web
          image: myregistry/ci-web:latest
          ports:
            - containerPort: 80
          env:
            # add any necessary environment variables here
            - name: API_BASE_URL
              value: "http://ci-gateway:9001" 