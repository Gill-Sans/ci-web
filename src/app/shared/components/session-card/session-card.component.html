<div
    class="session-card"
    [class.session-card--neutral]="variant === 'neutral'"
    [class.session-card--warn]="variant === 'warn'"
    [class.session-card--danger]="variant === 'danger'"
    [class.session-card--no-checkin]="session | specialSession"
    [class.special-session]="session.title.toLowerCase().includes('keynote')"
>
    <!-- header -->
    <div class="session-header">
        <h3 class="session-title">{{ session.title }}</h3>
        <div class="session-time">
            {{ session.startTime | date:'shortTime' }}
            —
            {{ session.endTime | date:'shortTime' }}
        </div>
    </div>

    <!-- content -->
    <div class="session-content">
        <div *ngIf="session.speaker" class="session-detail">
            <mat-icon>person</mat-icon>
            <span>{{ session.speaker }}</span>
        </div>

        <div class="session-detail">
            <mat-icon>room</mat-icon>
            <span>{{ session.locationDetails || 'No Room' }}</span>
        </div>

        <!-- attendee avatars (hidden for non-checkin sessions) -->
        <div *ngIf="!(session | specialSession) && checkins.length" class="checkin-avatars">
            <div class="avatars">
                <ng-container *ngFor="let c of displayedCheckins">
                    <div class="avatar" [matTooltip]="c.firstName + ' ' + c.lastName">
                        <mat-icon>person</mat-icon>
                    </div>
                </ng-container>
                <div *ngIf="overflowCount" class="avatar avatar--overflow" [matTooltip]="overflowNames">
                    +{{ overflowCount }}
                </div>
            </div>
        </div>
    </div>

    <!-- actions (hidden for non-checkin sessions) -->
    <div class="session-actions" *ngIf="!(session | specialSession)">
        <button
            mat-flat-button
            matTooltip="You are already checked in to another session at this time"
            matTooltipShowOnDisabled="true"
            class="session-action-button"
            [class.neutral]="variant === 'neutral'"
            [class.warn]="variant === 'warn'"
            [class.danger]="variant === 'danger'"
            [disabled]="isTimeConflict"
            (click)="isCheckedIn ? checkOut.emit(session) : checkIn.emit(session)"
        >
            <mat-icon
                [class.neutral-icon]="variant === 'neutral'"
                [class.warn-icon]="variant === 'warn'"
                [class.danger-icon]="variant === 'danger'"
            >
                {{ isCheckedIn ? 'person_remove' : 'person_add' }}
            </mat-icon>
            {{ isCheckedIn ? 'Check Out' : 'Check In' }}
        </button>
    </div>
</div>
